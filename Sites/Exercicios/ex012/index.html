<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML-5</title>
</head>
<body>
    <h1>Inserindo Vídeos Hospedados Localmente</h1>
    <p>Este vídeo esta hospedado no meu próprio servidor.</p>
    <video width="250px" poster="imagens/O MUNDO DOS.png" controls AUTOPLAY loop>
        <source src="media/Video002-1.mp4" type="video/mp4">
        <source src="media/Video002.m4v" type="video/m4v">
        <source src="media/Video002.ogv" type="video/ogv">
        <source src="media/Video002.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidade com os formatos de vídeo.</p>
    </video>
    <H1>Inserindo videos do Youtube</H1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/LW0bhKitRBk?si=uT7PyS5HgfJOvYRp" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
