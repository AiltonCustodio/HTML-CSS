<body>
    <h1>Paragrafos e Quebras de Linhas</h1>
    <hr>
    <p>Você pode escrever um Paragrafo de qualquer jeito, basta colocar tudo no meio de tag´s &lt;p&gt; e &lt;/p&gt;.<!-- significados:lt = less them e gt = greater then--></p>
    <p>Se precisar quebrar o texto em qualquerligar, <br> usar a tag &lt;br&gt;.</p>
    <p>Vamos adicionar alguns símbolos especiais.
            &reg;
            &copy;
            &TRADE;
            &euro;
            &pound;
            &uarr;
    </p>
    <p>
        Vamos usar alguns emojis.
        &#x1f596;
        &#x1f913;
    </p>
